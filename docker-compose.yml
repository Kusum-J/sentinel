version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: sentinel-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sentinel-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=sentinel
      - REDIS_ADDR=redis:6379
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sentinel-worker
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=sentinel
      - REDIS_ADDR=redis:6379
      - WORKER_COUNT=5
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

volumes:
  mongo-data:
