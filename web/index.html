<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel — Real-Time Health & Uptime Dashboard</title>
  <meta name="description" content="Real-time URL health monitoring dashboard. Track uptime, response times, and status transitions instantly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-slate: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.2);
      --warning: #f59e0b;
      --glass: rgba(30, 41, 59, 0.7);
      --border-glass: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Header styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-indicator {
      width: 12px;
      height: 12px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .refresh-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--glass);
      border: 1px solid var(--border-glass);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .refresh-dot {
      width: 6px;
      height: 6px;
      background-color: var(--primary);
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Grid layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 320px 1fr;
      }
    }

    /* Glass Cards */
    .card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: var(--text-main);
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-glass);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    /* Monitors List styles */
    .monitor-table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }

    th {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      font-size: 0.9rem;
    }

    .url-cell {
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .url-link {
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .url-link:hover {
      color: var(--primary);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-up {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.25);
      box-shadow: 0 0 10px var(--success-glow);
    }

    .badge-down {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.25);
      box-shadow: 0 0 10px var(--danger-glow);
    }

    .badge-pending {
      background-color: rgba(245, 158, 11, 0.1);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }

    /* Response time ranges */
    .resp-fast { color: var(--success); }
    .resp-avg { color: var(--warning); }
    .resp-slow { color: var(--danger); }

    /* Action Buttons */
    .btn-delete {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--danger);
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 0.375rem;
      width: auto;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
      transform: none;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--bg-slate);
      border: 1px solid var(--border-glass);
      padding: 1rem 1.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: none;
      animation: slideUp 0.3s ease;
      z-index: 1000;
      font-weight: 500;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-indicator" id="global-status-dot"></div>
        <h1>Sentinel</h1>
      </div>
      <div class="refresh-badge">
        <div class="refresh-dot"></div>
        Auto-refreshing (3s)
      </div>
    </header>

    <div class="grid">
      <!-- Add Monitor Sidebar -->
      <div class="card">
        <h2 class="card-title">Add Monitor</h2>
        <form id="add-monitor-form">
          <div class="form-group">
            <label for="url">Target URL</label>
            <input type="url" id="url" placeholder="https://example.com" required>
          </div>
          <div class="form-group">
            <label for="interval">Check Interval</label>
            <select id="interval">
              <option value="10">10 Seconds (Demo)</option>
              <option value="30">30 Seconds</option>
              <option value="60">60 Seconds</option>
              <option value="300">5 Minutes</option>
            </select>
          </div>
          <button type="submit" id="submit-btn">Add Monitor</button>
        </form>
      </div>

      <!-- Monitors List -->
      <div class="card">
        <h2 class="card-title">Monitored Services</h2>
        <div class="monitor-table-container">
          <table>
            <thead>
              <tr>
                <th>Service / URL</th>
                <th>Status</th>
                <th>Resp. Time</th>
                <th>Interval</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="monitor-list-body">
              <tr>
                <td colspan="5" class="empty-state">Loading monitors...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toast">Notification text</div>

  <script>
    const monitorForm = document.getElementById('add-monitor-form');
    const listBody = document.getElementById('monitor-list-body');
    const globalStatusDot = document.getElementById('global-status-dot');
    const toast = document.getElementById('toast');

    // Show custom toast notification
    function showToast(message, isError = false) {
      toast.innerText = message;
      toast.style.borderColor = isError ? 'var(--danger)' : 'var(--border-glass)';
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    // Fetch and render monitors
    async function fetchMonitors() {
      try {
        const response = await fetch('/urls');
        if (!response.ok) throw new Error('Failed to fetch monitors');
        const monitors = await response.json();
        
        renderMonitors(monitors);
      } catch (err) {
        console.error(err);
        showToast('Error connecting to API server', true);
      }
    }

    // Render list elements
    function renderMonitors(monitors) {
      if (monitors.length === 0) {
        listBody.innerHTML = `<tr><td colspan="5" class="empty-state">No URLs monitored yet. Add one in the sidebar!</td></tr>`;
        globalStatusDot.style.backgroundColor = 'var(--text-muted)';
        globalStatusDot.style.boxShadow = 'none';
        return;
      }

      let allUp = true;
      let html = '';

      monitors.forEach(m => {
        let statusBadge = '';
        let respTime = '-';
        let respClass = '';

        if (!m.latest_check) {
          statusBadge = `<span class="badge badge-pending"><span class="status-dot"></span>Pending</span>`;
        } else {
          if (m.latest_check.is_up) {
            statusBadge = `<span class="badge badge-up"><span class="status-dot"></span>UP</span>`;
            const ms = m.latest_check.response_time_ms;
            respTime = `${ms} ms`;
            
            if (ms < 200) respClass = 'resp-fast';
            else if (ms < 500) respClass = 'resp-avg';
            else respClass = 'resp-slow';
          } else {
            statusBadge = `<span class="badge badge-down"><span class="status-dot"></span>DOWN</span>`;
            allUp = false;
            respTime = 'Failed';
            respClass = 'resp-slow';
          }
        }

        html += `
          <tr id="row-${m.id}">
            <td class="url-cell">
              <a href="${m.url}" target="_blank" class="url-link">${m.url}</a>
            </td>
            <td>${statusBadge}</td>
            <td class="${respClass}" style="font-weight: 600;">${respTime}</td>
            <td>${m.interval_seconds}s</td>
            <td>
              <button class="btn-delete" onclick="deleteMonitor('${m.id}')">Delete</button>
            </td>
          </tr>
        `;
      });

      listBody.innerHTML = html;

      // Update global logo status dot
      if (allUp) {
        globalStatusDot.style.backgroundColor = 'var(--success)';
        globalStatusDot.style.boxShadow = '0 0 12px var(--success)';
      } else {
        globalStatusDot.style.backgroundColor = 'var(--danger)';
        globalStatusDot.style.boxShadow = '0 0 12px var(--danger)';
      }
    }

    // Submit form handler
    monitorForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const urlInput = document.getElementById('url');
      const intervalSelect = document.getElementById('interval');
      const submitBtn = document.getElementById('submit-btn');

      const url = urlInput.value.trim();
      const interval = parseInt(intervalSelect.value);

      submitBtn.disabled = true;
      submitBtn.innerText = 'Adding...';

      try {
        const response = await fetch('/urls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, interval_seconds: interval })
        });

        const data = await response.json();

        if (response.status === 201) {
          showToast('URL added successfully!');
          urlInput.value = '';
          fetchMonitors();
        } else {
          showToast(data.error || 'Failed to add URL', true);
        }
      } catch (err) {
        showToast('Network error adding URL', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Add Monitor';
      }
    });

    // Delete monitor handler
    async function deleteMonitor(id) {
      if (!confirm('Are you sure you want to stop monitoring this URL?')) return;

      try {
        const response = await fetch(`/urls/${id}`, {
          method: 'DELETE'
        });

        if (response.status === 204) {
          showToast('Monitor deleted');
          // Instantly remove row from DOM to make UI feel snappy
          const row = document.getElementById(`row-${id}`);
          if (row) row.remove();
          fetchMonitors(); // full fetch to recalculate state
        } else {
          showToast('Failed to delete monitor', true);
        }
      } catch (err) {
        showToast('Network error deleting monitor', true);
      }
    }

    // Initial load
    fetchMonitors();

    // Auto refresh loop
    setInterval(fetchMonitors, 3000);
  </script>
</body>
</html>
